method: derived
source: >-
  Derived from the ArcGIS layer metadata documents fetched anonymously from
  services1.arcgis.com/NKgP4VcXUzEyOnmg on 2026-07-27 (one GET per layer,
  f=json) and from the live query responses saved verbatim under examples/.
  Every field name, type and value band below was read off the live service.
  ENMAX publishes no data dictionary, so nothing here comes from documentation.
api: enmax:enmax-power-system-capacity-arcgis-feature-services
model_type: geospatial-feature-classes
note: >-
  This is a flat feature-class model, not a relational one. There are no foreign
  keys, no $ref graph and no OpenAPI schemas — ArcGIS layers are independent
  tables of geometry plus attributes. The one real join key is FEEDERID, which
  is not declared as a key anywhere and is not enforced.

entities:
- name: HostingCapacitySegment
  service: Generation_Capacity_Layers_20250219_PUBLIC
  layers: [1, 2]
  layer_name: Three Phase - Estimated Remaining Hosting Capacity (February 2025)
  geometry_type: esriGeometryPolyline
  object_id_field: OBJECTID
  feature_count: 2852
  description: >-
    A segment of ENMAX Power three-phase distribution primary, carrying the
    estimated remaining headroom for connecting distributed energy resources
    (solar, storage) at that point on the feeder. This is the entity a DER
    developer actually needs before siting a project.
  fields:
  - {name: OBJECTID, type: esriFieldTypeOID, role: identifier}
  - {name: FEEDERID, type: esriFieldTypeString, length: 20, role: join-key, nullable_observed: true}
  - {name: Description, type: esriFieldTypeString, role: classification, example: Three Phase Primary Overhead}
  - {name: Phase_Designation, type: esriFieldTypeString, role: classification, example: ABC}
  - {name: Range, type: esriFieldTypeString, role: measure-band, example: 1,000 kW - 4,999 kW}
  - {name: Date_Last_Updated, type: esriFieldTypeString, role: vintage, example: February 2025}
  - {name: Shape__Length, type: esriFieldTypeDouble, role: geometry-derived, units: esriMeters}
  measure_note: >-
    Capacity is published as a STRING BAND (Range), not a number. There is no
    numeric hosting-capacity field on this entity, so a consumer cannot compute,
    sort or threshold on it without parsing the band text.
  duplicate_layer_note: >-
    Layers 1 and 2 carry an identical field set and layer name — a cartographic
    split (two symbology renderers over the same data) surfaced as two API
    resources. Query both or neither; there is nothing in the metadata that says
    which.
- name: LoadCapacitySegment
  service: Feeder_Load_Capacity_Rev9_20251211
  layers: [0, 1]
  layer_name: Two and Three Phase Estimated Remaining Load Capacity (December 2025)
  geometry_type: esriGeometryPolyline
  object_id_field: OBJECTID
  feature_count: 30057
  description: >-
    A segment of ENMAX Power two- or three-phase distribution primary carrying
    the estimated remaining LOAD capacity — headroom for new demand rather than
    new generation. The complement of HostingCapacitySegment.
  fields:
  - {name: OBJECTID, type: esriFieldTypeOID, role: identifier}
  - {name: FEEDERID, type: esriFieldTypeString, role: join-key, example: 8-10.12}
  - {name: Description, type: esriFieldTypeString, role: classification, example: 3 Phase Primary}
  - {name: Phase_Designation, type: esriFieldTypeString, role: classification, example: ABC}
  - {name: F_timestamp, type: esriFieldTypeString, role: vintage, example: December 2025}
  - {name: Capacity_Available, type: esriFieldTypeString, role: measure-band, example: 1,000-2,999KVA}
  - {name: KVA_Number, type: esriFieldTypeDouble, role: measure, units: kVA, example: 2999}
  - {name: Shape__Length, type: esriFieldTypeDouble, role: geometry-derived, units: esriMeters}
  measure_note: >-
    Unlike the hosting-capacity entity this one DOES carry a numeric measure,
    KVA_Number — but it is the upper bound of the Capacity_Available band, not a
    point estimate (band "1,000-2,999KVA" carries 2999; band "< 999 KVA" carries
    999). Treat it as a ceiling, never as an available figure.
  duplicate_layer_note: Layers 0 and 1 are the same cartographic split as above.
