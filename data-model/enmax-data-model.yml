relationships:
- from: HostingCapacitySegment
  to: LoadCapacitySegment
  type: relates_to
  via: FEEDERID
  cardinality: many_to_many
  enforced: false
  confidence: medium
  note: >-
    Both entities carry a FEEDERID naming the same physical distribution feeder,
    so generation headroom and load headroom can be joined per feeder. Neither
    layer declares it as a key, no referential integrity exists, and FEEDERID
    was observed null on some hosting-capacity rows — join defensively.
- from: HostingCapacitySegment
  to: ServiceArea
  type: contained_by
  via: geometry (spatial)
  cardinality: many_to_one
  enforced: false
  note: Spatial containment only; there is no attribute linking them.
- from: LoadCapacitySegment
  to: ServiceArea
  type: contained_by
  via: geometry (spatial)
  cardinality: many_to_one
  enforced: false
- from: NoDataArea
  to: [HostingCapacitySegment, LoadCapacitySegment]
  type: negates
  via: geometry (spatial)
  note: >-
    Where a NoDataArea polygon covers a site, the absence of capacity features
    means "not published", not "no capacity".

spatial_reference:
  wkid_name: Calgary_3TM_WGS_1984_W114
  projection: Transverse_Mercator
  central_meridian: -114.0
  scale_factor: 0.9999
  datum: D_WGS_1984
  units: Meter
  note: >-
    Geometry comes back in a Calgary-local 3TM projection, not WGS 84
    lat/long. Request outSR=4326 (or use f=geojson, which returns WGS 84) if you
    need geographic coordinates.

identifiers:
  primary: OBJECTID
  stability: >-
    OBJECTID is service-local and NOT stable across revisions — it is
    regenerated when a new dated service is published. FEEDERID is the only
    identifier with real-world meaning, and it is not unique per row (many
    segments share a feeder).

gaps:
- No data dictionary, no field definitions and no units documentation is published by ENMAX.
- >-
  No numeric hosting-capacity value exists — only the Range string band, which
  cannot be sorted or thresholded without parsing.
- >-
  No temporal dimension. Each service is a single dated snapshot; there is no
  history, no time-series and no way to query capacity as of an earlier date.
