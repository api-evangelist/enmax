apis:
- aid: enmax:enmax-power-system-capacity-arcgis-feature-services
  name: ENMAX Power System Capacity ArcGIS Feature Services
  description: >-
    The machine-readable grid data behind ENMAX Power's public Hosting Capacity,
    Load Capacity and Service Area maps. The three maps published at
    enmax.com/system-resources are ArcGIS Online Web AppBuilder applications
    hosted in the GeoARM ArcGIS Online organization, and their operational layers
    resolve to ArcGIS REST feature services on services1.arcgis.com that answer
    anonymous queries. Generation_Capacity_Layers_20250219_PUBLIC carries
    estimated remaining DER hosting capacity by distribution feeder segment
    (fields OBJECTID, FEEDERID, Description, Phase_Designation, Range,
    Date_Last_Updated), Feeder_Load_Capacity_Rev9_20251211 carries estimated
    remaining load capacity as of December 2025, and
    ENMAX_Service_Area_for_LAF_Verification carries the distribution service
    boundary. Verified anonymously on 2026-07-27: the service directory, each
    FeatureServer metadata document, and a live /query returning attribute rows
    all responded HTTP 200 with application/json and no credential of any kind.
    This is genuinely open grid data — but it is open by consequence of Esri
    hosting rather than by design. ENMAX publishes no developer portal, no API
    reference, no OpenAPI, no rate limits, no terms of use and no versioning
    policy for these endpoints, and never describes them as an API anywhere on
    enmax.com. The service names are date-stamped and have already rolled from
    Rev8 to Rev9, so the paths are not stable contracts. Treat as an
    undocumented but real public data surface.
  humanURL: https://www.enmax.com/system-resources
  baseURL: https://services1.arcgis.com/NKgP4VcXUzEyOnmg/arcgis/rest/services
